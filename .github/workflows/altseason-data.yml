name: Altseason data

# Refreshes data/altseason.json (90-day history for /altseason/) once a day.
on:
  schedule:
    - cron: '20 0 * * *'   # 00:20 UTC = 08:20 Malaysia time
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: altseason-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build data/altseason.json from CoinGecko
        run: python3 scripts/build_altseason_data.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/altseason.json
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Altseason data: daily refresh"
          git push
      - name: Request a Pages build
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
